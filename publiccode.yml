description:
  en:
    shortDescription: Official React implementation of the Astoria Design System
    features:
      - Accessible, typed and tree-shakable React components
      - SSR helpers for Next.js (Pages Router and App Router)
      - Design tokens exposed as CSS custom properties
      - Interactive component documentation (Storybook)
    longDescription: |
      ADS React is the official React implementation of the Astoria Design System (ADS),
      the design system for the digital ecosystem of the Republic of Astoria.

      It provides accessible, fully typed and tree-shakable React components (Button,
      Alert, Card, Header, Footer, Modal, Tabs, Tables, forms…), integration helpers for
      Next.js (Pages Router and App Router), SPA setups (Vite, CRA) and optional MUI and
      chart layers.

      The project started as a fork of the French react-dsfr library and is being
      progressively transformed into an independent design system: audit and roadmap are
      documented in the repository (AUDIT.md, MIGRATION.md, PROVENANCE.md).
